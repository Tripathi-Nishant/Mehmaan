<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Mehmaan{% endblock %}</title>
<style>body{font-family:system-ui;margin:0;background:#fff8ef;color:#27201b}main{max-width:960px;margin:0 auto;padding:32px 20px}.brand{color:#b5482b;font-weight:800;font-size:1.4rem}form{display:flex;gap:8px;margin:28px 0}input{flex:1;padding:12px;border:1px solid #d9c7b4;border-radius:10px}button{padding:12px 18px;background:#b5482b;color:white;border:0;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:white;border:1px solid #eadbca;border-radius:16px;padding:18px}.muted{color:#75685e}.price{font-weight:700;color:#b5482b}</style>
</head><body><main><a class="brand" href="/">mehmaan</a>{% block content %}{% endblock %}</main></body></html>
